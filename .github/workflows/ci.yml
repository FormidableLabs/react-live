name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: Check
        run: npm run check
      # Also builds the website, which is what Vercel deploys. `typecheck` runs
      # with `noEmit`, so this is the only thing that exercises declaration emit
      # and the Docusaurus production build.
      - name: Build
        run: npm run build
